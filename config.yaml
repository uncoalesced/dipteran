# Dipteran route + runtime configuration.
# No lat/lon constants live in code -- everything routeable is a field here.
# Loaded and validated by dipteran/config.py (Pydantic).

route:
  name: silk_board_to_tin_factory

  origin:
    label: Central Silk Board Junction
    lat: 12.9177
    lon: 77.6238

  destination:
    label: Tin Factory
    lat: 13.0039
    lon: 77.6653

  # Radius of the OSM extract around origin, in metres.
  dist_m: 15000

  # OSMnx network_type: what counts as a traversable way.
  network_type: drive

  # Bangalore envelope. The frontend's MapLibre maxBounds uses the same
  # numbers; origin and destination are validated to fall inside it.
  bbox:
    west: 77.40
    south: 12.80
    east: 77.80
    north: 13.15

compute:
  # torch device for the connectome sparse matrix.
  device: cuda:0
  # Measured on an RTX 5050: fp32 costs 116.5 MiB against fp16's 87.3 MiB and
  # is 5% slower per sparse matmul (0.989 vs 0.943 ms). Both are trivial
  # against 8 GB, so fp32 is the default -- it removes a real hazard. Weights
  # are raw aggregate synapse counts up to 2405 and in-degree runs to
  # hundreds, so fp16 products saturate to inf within a couple of LIF
  # sub-ticks unless every step is rescaled. Switch to float16 only if the
  # 29 MiB matters.
  dtype: float32
  # Drop connected pairs below this many aggregate synapses. 0 keeps all
  # 15.1M pairs, which is PLAN.md's maximum-fidelity decision. Note the
  # median pair in v783 has only 2 synapses and the FlyWire papers treat
  # >=5 as the threshold for a reliable connection -- raise this if the weak
  # tail dominates Phase 2's dynamics.
  min_syn_count: 0

paths:
  data_dir: data
  cache_dir: cache

  # FlyWire v783 static archive: fetched by dipteran/connectome.py, never
  # committed. See DATA_LICENSE.md. Filenames match the upstream downloads.
  #   proofread_connections_783.feather -- Zenodo record 10676866 (852 MB),
  #     already aggregated per (neuron pair, neuropil); avoids the 9.5 GB
  #     per-synapse table entirely.
  #   Supplemental_file1_neuron_annotations.tsv -- flyconnectome/flywire_annotations
  connectome_edges: data/flywire/proofread_connections_783.feather
  cell_annotations: data/flywire/Supplemental_file1_neuron_annotations.tsv

  # Derived: neuron row order for the adjacency matrix.
  neuron_index: cache/neuron_index_783.npy
  cluster_ids: cache/cluster_ids_783.json

  # Derived road-network artefacts (all gitignored).
  osm_extract: cache/bangalore.osm.xml
  sumo_net: cache/bangalore.net.xml
  graphml: cache/bangalore_drive.graphml
  id_map: cache/osm_sumo_edge_map.json

sumo:
  # Phase 2 sync decision: SUMO 10 Hz, SNN 50 Hz, batched control every 5th
  # SNN tick. Measured against live traci in Phase 2 and it holds with room
  # to spare -- 61 ms of a 100 ms frame, 1.64x real time, and SUMO is only
  # 3.5 ms of that. See scripts/bench_sync.py.
  step_length: 0.1
  # null -> resolve netconvert via SUMO_HOME or PATH.
  binary_dir: null

snn:
  # Excitability. This is the one number PHASE1_REPORT.md warned could not be
  # guessed: edge weights are raw aggregate synapse counts up to 2405, so
  # PLAN.md's sketch value of v_thresh=1.0 against them is meaningless. Rows
  # are normalised by their own total input weight instead, leaving `gain` as
  # the single excitability knob, and it was swept rather than picked --
  # `python -m dipteran.navigator` reproduces the table. 16.0 is the lowest
  # gain that both keeps the network off its rails (33.5 Hz) and gets the
  # descending motor neurons firing fast enough to steer (17.7 Hz); at 8.0
  # the motors manage 1.1 Hz and the vehicle simply never turns.
  gain: 16.0
  decay: 0.9
  v_thresh: 1.0
  v_reset: -0.2
  # LIF sub-ticks per 20 ms SNN tick, so one sub-tick is 2 ms.
  subticks: 10
  # Three-factor reinforcement: eligibility trace x (PAM - PPL1), scaled by
  # each synapse's own anatomical weight. The relative form is not cosmetic:
  # `plastic` holds row-normalised weights (~1e-4) while the trace saturates
  # at 1/(1 - trace_decay) = 5, so an absolute learning_rate of 0.01 applied
  # 0.05 per tick -- 500x the synapse it was modifying. A 55-minute route run
  # caught it: relative drift went 9.6e-03 -> 6.0e-01 in 40 seconds, pinned
  # against the clamp, and the vehicle flatlined at 0.00 m/s permanently.
  # At 1e-4 the cap is 0.05% of baseline per tick, so real adaptation needs
  # ~1000 ticks (20 s) of sustained dopamine.
  learning_rate: 0.0001
  trace_decay: 0.8
  # Slow return toward the anatomy, applied every tick whether dopamine
  # arrives or not. Recovery from a punished episode cannot depend on being
  # rewarded later: a long stall punishes the very motor pathway needed to
  # escape it, and without this the stall is permanent.
  homeostasis: 0.001
  # Learned weights stay inside +/- this fraction of |anatomical weight|, so
  # reinforcement can bias the connectome but never invent a pathway that is
  # not in it, and never flip an inhibitory synapse excitatory.
  plastic_span: 0.5

vehicle:
  # The boundary between two different quantities. MotorOutput.throttle is a
  # DNg02 *population firing rate* -- measured at 0.05-0.24, because
  # descending neurons sit in balanced excitation and inhibition and fire
  # sparsely, which is what a real brain does. The motion model wants a
  # command in [0, 1]. Treating the rate as the command pins the vehicle at
  # 5% throttle: an accurate brain wired to a mis-scaled servo. Raising
  # snn.sensory_gain does not help -- throttle holds at 0.04-0.05 from 1x to
  # 32x, and past 8x the giant fiber starts firing on 45-70% of ticks.
  throttle_scale: 4.0
  steer_scale: 2.5
  max_speed_ms: 16.0
  max_accel_ms2: 2.5
  brake_ms2: 8.0
  max_turn_deg_s: 45.0
  # Fraction of the off-road offset the soft pull closes per second. This is
  # what keeps the hybrid motion model attached to the road network without
  # snapping the fly onto a lane, so it can still take wrong turns.
  edge_pull_per_s: 2.0
  pothole_density: 0.05
